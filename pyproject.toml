[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfsum"
version = "0.1.0"
description = "Genera resúmenes extractivos de archivos PDF, sin conexión a internet"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Efrain" }]
dependencies = [
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
pdfsum = "pdfsum.cli:main"

[tool.setuptools.packages.find]
include = ["pdfsum*"]
